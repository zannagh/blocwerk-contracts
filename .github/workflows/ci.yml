name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (schemas, fixtures, OpenAPI, pydantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  generate-check:
    name: generated code matches the schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: pip install -r requirements-dev.txt
      - run: scripts/generate.sh
      - name: fail on any difference
        run: |
          git add -N python/src dotnet/Blocwerk.Contracts.Compute/Generated
          git diff --exit-code -- python/src dotnet/Blocwerk.Contracts.Compute/Generated

  dotnet:
    name: .NET build and round-trips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test dotnet/Blocwerk.Contracts.slnx -c Release
      - run: dotnet pack dotnet/Blocwerk.Contracts.Compute -c Release -o dist
